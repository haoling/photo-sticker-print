{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "psp.fullname" . }}
  labels:
    {{- include "psp.labels" . | nindent 4 }}
type: Opaque
stringData:
  IMMICH_API_KEY: {{ required "secret.immichApiKey か secret.existingSecret を指定してください" .Values.secret.immichApiKey | quote }}
{{- end }}
