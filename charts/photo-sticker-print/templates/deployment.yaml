apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "psp.fullname" . }}
  labels:
    {{- include "psp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "psp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "psp.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if not .Values.secret.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
          env:
            - name: IMMICH_URL
              value: {{ required "config.immichUrl を指定してください" .Values.config.immichUrl | quote }}
            - name: PORT
              value: {{ .Values.config.port | quote }}
            {{- if .Values.config.printerScanSubnet }}
            - name: PRINTER_SCAN_SUBNET
              value: {{ .Values.config.printerScanSubnet | quote }}
            {{- end }}
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "psp.secretName" . }}
                  key: IMMICH_API_KEY
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
