image:
  repository: ghcr.io/haoling/photo-sticker-print
  # 省略時は Chart の appVersion
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1
# 古い ReplicaSet を残さない
revisionHistoryLimit: 0

# アプリ設定
config:
  # 必須: Immich サーバーの URL
  immichUrl: ''
  # 任意: IP スキャンの初期値（例: 192.168.1.0/24）
  printerScanSubnet: ''
  port: 3000

# Immich API キー
secret:
  # 既存 Secret を使う場合はその名前（キーは IMMICH_API_KEY）
  existingSecret: ''
  # existingSecret 未指定時に Secret を作成する値
  immichApiKey: ''

# true にすると Pod がノードのネットワークを使う（mDNS でプリンタを探すのに必要）
hostNetwork: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: photo-sticker-print.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraEnv: []
